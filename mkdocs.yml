site_name: MessyStash
site_description: Documentation du projet MessyStash

site_url: https://Kkiriya.github.io/MessyStash-Documentaion/
repo_url: https://github.com/Kkiriya/MessyStash-Documentaion
repo_name: MessyStash-Documentaion
edit_uri: edit/main/docs/

theme:
  name: material
  language: fr

  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Mode sombre

    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Mode clair

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Product Idea & Identity: product-idea-&-identity.md
  - Meeting Notes: meetings/index.md
  - Sprint Retrospective: sprint-retro/index.md
  - App Architecture:
      - Introduction: architecture/index.md
      - Frontend Pages: architecture/frontend-pages.md
      - API Endpoints: architecture/api-endpoints.md
  - Epic:
      - Introduction: epics/index.md
      - Epic 01 - Gestion de boites: epics/epic-01.md
  - User Story:
      - Introduction: user-story/index.md
      - US01 - Create Storage Box: user-story/us01-create-storage-box.md
      - US02 - View Storage Box: user-story/us02-view-storage-box.md
      - US03 - Edit Storage Box: user-story/us03-edit-storage-box.md
  - Persona:
      - Introduction: persona/index.md
      - Persona 01 - Alex Tremblau: persona/p01-Alex.md
      - Persona 02 - Sophie Gagnon: persona/p02-Sophie.md
  - Instructions for Specific Assignements:
      - DA2M — Atelier de lancement du projet d’équipe: instructions/DA2M_Atelier_lancement_projet.md
  - Assignements:
      - DA2M — Rapport de lancement du projet d’équipe: assignements/DA2M_Rapport_lancement_equipe_neptune.md
